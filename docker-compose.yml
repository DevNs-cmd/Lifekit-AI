services:
  postgres:
    image: postgres:16-alpine
    container_name: lifekit-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifekit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifekit}
      POSTGRES_DB: ${POSTGRES_DB:-lifekit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifekit} -d ${POSTGRES_DB:-lifekit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lifekit-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: lifekit-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lifekit-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifekit}:${POSTGRES_PASSWORD:-lifekit}@postgres:5432/${POSTGRES_DB:-lifekit}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-change-in-prod}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: lifekit-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_PORT: 8000
      AI_SERVICE_DATABASE_URL: postgresql://${POSTGRES_USER:-lifekit}:${POSTGRES_PASSWORD:-lifekit}@postgres:5432/${POSTGRES_DB:-lifekit}
      AI_SERVICE_REDIS_URL: redis://redis:6379
      AI_SERVICE_QDRANT_URL: http://qdrant:6333
      AI_SERVICE_OPENAI_API_KEY: ${AI_SERVICE_OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: lifekit-worker
    restart: unless-stopped
    environment:
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-lifekit}:${POSTGRES_PASSWORD:-lifekit}@postgres:5432/${POSTGRES_DB:-lifekit}
      WORKER_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: lifekit-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  qdrant-data:

