org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Fix: Kotlin incremental compiler fails when project drive (D:\) differs
#         from pub cache drive (C:\) — disable incremental compilation so
#         Kotlin does not try to build cross-drive relative paths into its
#         persistent cache files, which causes the AssertionError/
#         IllegalArgumentException crash in url_launcher_android.
kotlin.incremental=false
kotlin.incremental.java=false

# Keep one long-lived Gradle daemon to avoid repeated cold starts
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
